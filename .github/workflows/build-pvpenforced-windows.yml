name: Build PvPEnforced - Windows (DirectX + OpenGL)

# Mesma receita do build-windows.yml upstream (presets + lukka/run-cmake), em matrix:
#   OpenGL  -> Pvpenforced_OpenGL.exe   (TOGGLE_DIRECTX=OFF)
#   DirectX -> Pvpenforced_DirectX.exe  (TOGGLE_DIRECTX=ON, DX9 via ANGLE)
# No fim publica os 2 exes numa Release (dx-build-<run>) pra download sem token.

on:
  workflow_dispatch:
  push:
    branches: [pvpenforced-dx]

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.renderer.name }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        renderer:
          - { name: OpenGL,  exe: Pvpenforced_OpenGL.exe,  directx: "OFF" }
          - { name: DirectX, exe: Pvpenforced_DirectX.exe, directx: "ON" }

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get vcpkg commit ID
        id: vcpkg-step
        shell: pwsh
        run: |
          $json = Get-Content vcpkg.json -Raw | ConvertFrom-Json
          $commit = $json.'builtin-baseline'
          echo "vcpkgGitCommitId=$commit" >> $env:GITHUB_OUTPUT

      - name: Compute vcpkg.json hash
        id: hash
        shell: pwsh
        run: |
          $json = Get-Content "vcpkg.json" -Raw -Encoding UTF8
          $bytes = [System.Text.Encoding]::UTF8.GetBytes($json)
          $sha256 = [System.Security.Cryptography.SHA256]::Create()
          $hashBytes = $sha256.ComputeHash($bytes)
          $hash = [BitConverter]::ToString($hashBytes) -replace '-', ''
          "hash=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Cache vcpkg artifacts (Windows)
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}/vcpkg/installed
            ${{ github.workspace }}/vcpkg/buildtrees
            ${{ github.workspace }}/vcpkg/downloads
          key: vcpkg-windows-2022-${{ matrix.renderer.name }}-${{ steps.hash.outputs.hash }}
          restore-keys: |
            vcpkg-windows-2022-${{ matrix.renderer.name }}-

      - name: CCache with SCCACHE
        uses: hendrikmuhs/ccache-action@main
        with:
          max-size: "1G"
          variant: "sccache"
          key: ccache-windows-2022-${{ matrix.renderer.name }}
          restore-keys: |
            ccache-windows-2022-${{ matrix.renderer.name }}

      - name: Remove Windows pre-installed MySQL (for clean builds)
        run: Remove-Item -Recurse -Force -ErrorAction SilentlyContinue "C:/mysql*"

      - name: Install vcpkg
        uses: lukka/run-vcpkg@a400452f634fe49e9f18d388aeb1809dcc642136
        with:
          vcpkgGitCommitId: ${{ steps.vcpkg-step.outputs.vcpkgGitCommitId }}

      - name: Get latest CMake and Ninja
        uses: lukka/get-cmake@v3.31.6

      # Ninja + MSVC precisam do ambiente do Developer Prompt (o run-cmake fazia isso por baixo)
      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        env:
          # sem token do cache do GHA (so o run-cmake injetava) o x-gha falha; cache vem do actions/cache
          VCPKG_BINARY_SOURCES: clear
        run: |
          Write-Host "VCPKG_ROOT=$env:VCPKG_ROOT"
          Write-Host "ninja: $(Get-Command ninja -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)"
          Write-Host "cl:    $(Get-Command cl -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source)"
          cmake --preset windows-release -DTOGGLE_DIRECTX=${{ matrix.renderer.directx }} 2>&1 | Tee-Object -FilePath configure.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build
        shell: pwsh
        env:
          VCPKG_BINARY_SOURCES: clear
        run: |
          cmake --build --preset windows-release 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Collect debug logs (on failure)
        if: failure()
        shell: pwsh
        run: |
          $d = "debuglogs"; New-Item -ItemType Directory -Force $d | Out-Null
          $r = "${{ matrix.renderer.name }}"
          foreach ($f in 'configure.log','build.log') {
            if (Test-Path $f) { Get-Content $f -Tail 600 | Set-Content "$d/$r-$f" }
          }
          Get-ChildItem -Recurse -Path build -Filter "CMake*.log" -ErrorAction SilentlyContinue | ForEach-Object {
            Get-Content $_.FullName -Tail 300 | Set-Content "$d/$r-$($_.Name)"
          }
          Get-ChildItem -Recurse -Path vcpkg/buildtrees -Filter "*.log" -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 8 | ForEach-Object {
              Get-Content $_.FullName -Tail 250 | Set-Content "$d/$r-$($_.Directory.Name)-$($_.Name)"
            }
          Get-ChildItem $d | ForEach-Object { Write-Host $_.Name }

      - name: Publish debug logs (on failure)
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-${{ github.run_number }}-${{ matrix.renderer.name }}
          name: DEBUG logs run ${{ github.run_number }} ${{ matrix.renderer.name }}
          prerelease: true
          files: debuglogs/*

      - name: Prepare artifact folder
        shell: pwsh
        run: |
          $artifactDir = "$env:GITHUB_WORKSPACE\artifacts"
          New-Item -ItemType Directory -Force -Path $artifactDir | Out-Null

          $exePath = Get-ChildItem -Recurse -Path $env:GITHUB_WORKSPACE -Filter "otclient*.exe" | Select-Object -First 1
          if (-not $exePath) {
            Write-Error "Not found otclient*.exe!"
            Get-ChildItem -Recurse -Path $env:GITHUB_WORKSPACE -Filter "*.exe" | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }

          $dest = Join-Path $artifactDir "${{ matrix.renderer.exe }}"
          Copy-Item $exePath.FullName -Destination $dest
          Write-Host "Built: $dest ($([math]::Round((Get-Item $dest).Length / 1MB, 2)) MB)"

          $dlls = Get-ChildItem -Path $exePath.Directory.FullName -Filter "*.dll"
          foreach ($dll in $dlls) { Copy-Item $dll.FullName -Destination $artifactDir }

          # Confirma o renderer pelos imports (dumpbin do VS, se existir no runner)
          $dumpbin = Get-ChildItem -Recurse -Path "C:\Program Files\Microsoft Visual Studio" -Filter dumpbin.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dumpbin) {
            Write-Host "--- Renderer imports ---"
            & $dumpbin.FullName /imports $dest 2>&1 | Select-String -Pattern "(d3d9|dxgi|d3dcompiler|OPENGL32|opengl32)\.dll" | ForEach-Object { Write-Host "  $_" }
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pvpenforced-${{ matrix.renderer.name }}
          path: artifacts/

  release:
    name: Publish release
    needs: build
    if: ${{ always() && contains(needs.build.result, 'success') || needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          pattern: pvpenforced-*
          merge-multiple: true

      - name: List
        run: ls -la out

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dx-build-${{ github.run_number }}
          name: PvPEnforced client build ${{ github.run_number }} (${{ github.sha }})
          body: |
            Base mehah/otclient 713ab7a + multiuse-fix (7.72) + icone PvPEnforced.
            OpenGL = TOGGLE_DIRECTX=OFF, DirectX = TOGGLE_DIRECTX=ON (DX9 via ANGLE).
          files: out/*.exe
          fail_on_unmatched_files: true
